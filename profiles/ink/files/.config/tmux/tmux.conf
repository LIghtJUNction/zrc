# zrc / Ink; uses tmux's native XDG configuration location.
set -g default-shell /usr/bin/zsh
set -g history-limit 10000
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g status-interval 5
set -g status-style "bg=#161412,fg=#a3978b"
set -g status-left "  #[fg=#d4a373,bold]#S#[default]   "
set -g status-left-length 32
set -g status-right "  #{pane_current_command}  "
set -g status-justify left
set -g window-status-separator "   "
setw -g window-status-format "#I  #W"
setw -g window-status-current-format "#[fg=#e8ded2,bold]#I  #W"
set -g pane-border-style "fg=#2a2521"
set -g pane-active-border-style "fg=#6f655c"
set -g message-style "bg=#2a2521,fg=#e8ded2"
set -g mode-style "bg=#45382e,fg=#e8ded2"
