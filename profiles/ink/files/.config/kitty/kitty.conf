# zrc / Ink — warm neutrals, opaque rendering, no animation.
font_family JetBrains Mono
font_size 13.0
window_padding_width 22
background #161412
foreground #e8ded2
selection_background #45382e
selection_foreground #e8ded2
cursor #d4a373
cursor_shape beam
cursor_blink_interval 0
enable_audio_bell no
visual_bell_duration 0
background_opacity 1.0
tab_bar_style separator
tab_separator "   "
tab_bar_margin_width 8
active_tab_foreground #d4a373
active_tab_background #161412
active_tab_font_style bold
inactive_tab_foreground #a3978b
inactive_tab_background #161412
scrollback_lines 10000
shell zsh
color0 #302a25
color1 #dc8e84
color2 #c4b18b
color3 #d9b67e
color4 #bea38f
color5 #c5a4b6
color6 #c9b3a0
color7 #d7ccbf
color8 #817569
color9 #edaaa0
color10 #d7c7a4
color11 #edd0a0
color12 #d6bba5
color13 #ddbfce
color14 #e0cbb8
color15 #f3eadf
