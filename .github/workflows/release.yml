name: Release profiles
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate profile composition
        run: python3 -m unittest discover -s tests -v
      - name: Build reviewed profile archive
        run: python3 scripts/release.py --tag "$GITHUB_REF_NAME"
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .dist/* --verify-tag --title "zrc $GITHUB_REF_NAME" --notes-file docs/release-notes.md
