name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate profile composition
        run: python3 -m unittest discover -s tests -v
      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
      - name: Validate native Cargo package and offline install
        run: python3 scripts/check_cargo.py --package
